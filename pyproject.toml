[tool.poetry]
name = "auto-kg"
version = "0.3.0"
description = "Code that I wrote for my master thesis: Automated Knowledge Graph Generation."
authors = ["Panos <panagiotisban@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "auto_kg"}]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
pandas = "^2.1.3"
gensim = "^4.3.2"
spacy = "^3.7.2"
labelbox = "^3.55.0"
pyyaml = "^6.0.1"
plotly = "^5.18.0"
flair = "^0.13.0"

[tool.poetry.group.dev.dependencies]
black = "^23.11.0"
pre-commit = "^3.5.0"
isort = "^5.12.0"
pytest = "^8.0"


[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
